name: Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - 'app/**'

permissions:
  contents: write

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set short SHA as image tag
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            lauraagabriele/devsecops-app:${{ steps.vars.outputs.sha_short }}
            lauraagabriele/devsecops-app:latest

      - name: Update image tag in Kubernetes manifest
        run: |
          sed -i "s|image: lauraagabriele/devsecops-app:.*|image: lauraagabriele/devsecops-app:${{ steps.vars.outputs.sha_short }}|" k8s/deployment.yaml
          cat k8s/deployment.yaml

      - name: Commit and push updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git diff --cached --quiet && echo "Nenhuma mudança no manifesto" || git commit -m "chore: deploy image ${{ steps.vars.outputs.sha_short }} [skip ci]"
          git push
